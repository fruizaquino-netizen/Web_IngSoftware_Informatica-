name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run Angular Unit Tests
        run: npx ng test --reporters=junit --watch=false
      - name: Run Cypress E2E Tests
        run: npx cypress run
